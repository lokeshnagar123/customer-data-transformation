# Generic Dimension Configuration Framework
# Supports: customer, product, location, supplier, employee, store, vendor, etc.
# No code changes needed - just update this YAML file for new dimensions

dimensions:
  customer:
    enabled: true
    description: "Customer Master Dimension"
    source:
      master_file: "stg_customer.csv"
      hierarchy_file: "customer_member_hier.csv"
      member_file: "customer_member.csv"
      attribute_file: "stg_customer_attr.csv"
      metadata_file: "customer_property_metadata.csv"
      hier_metadata_file: "customer_hier.csv"
    
    entity_keys:
      entity_id_col: "MEMBER_ID"
      entity_name_col: "MEMBER_NM"
      entity_desc_col: "MEMBER_DESC"
      parent_id_col: "PARENT_MEMBER_ID"
      level_col: "LEVELNAME"
      assoc_type_col: "MEMBER_ASSOC_TYPE_CD"
    
    master_column_mapping:
      MEMBER_ID: "DIMENSION_ID"
      MEMBER_NM: "DIMENSION_NM"
      MEMBER_DESC: "DIMENSION_DESC"
      LEVELNAME: "LEVELNAME"
    
    hierarchy_column_mapping:
      MEMBER_ID: "MEMBER_ID"
      PARENT_MEMBER_ID: "PARENT_MEMBER_ID"
      VALID_FROM_DTTM: "VALID_FROM_DTTM"
      VALID_TO_DTTM: "VALID_TO_DTTM"
    
    attribute_column_mapping:
      CUSTOMER_ID: "DIMENSION_ID"
      CUSTOMER_INTRODUCTION_DT: "INTRODUCTION_DT"
      CUSTOMER_DISCONTINUED_DT: "DISCONTINUED_DT"
      KEY_ACCOUNT: "KEY_ACCOUNT"
      NUMBER_LOCS: "NUMBER_LOCS"
      ECOM: "ECOM"
      DSD: "DSD"
      B_AND_M: "B_AND_M"
      CENTRALLY_SOURCED: "CENTRALLY_SOURCED"
      COUNTRY: "COUNTRY"
      MIN_ORDER: "MIN_ORDER"
      ACCOUNT_FEE: "ACCOUNT_FEE"
    
    date_columns:
      - "VALID_FROM_DTTM"
      - "VALID_TO_DTTM"
      - "INTRODUCTION_DT"
      - "DISCONTINUED_DT"
    
    date_format_input: "%d%b%Y"
    date_format_output: "%Y-%m-%d %H:%M:%S"
    
    sentinel_dates:
      "31DEC5999": "5999-12-31 00:00:00"
      "31DEC9999": "9999-12-31 00:00:00"
    
    dedup_key:
      - "DIMENSION_ID"
    
    output_files:
      dimension_dim: "customer_dim.csv"
      hierarchy_dim: "customer_hierarchy_dim.csv"
      metadata_dim: "customer_property_metadata_dim.csv"
      master_target: "customer_master_target.csv"

